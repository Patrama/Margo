<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Catalog Explorer — search SKU, prices, and product details from the catalog."
    />
    <title>Catalog Explorer 🍃</title>

    <!-- Inline SVG favicon: zero extra requests, no favicon.ico 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🍃</text></svg>"
    />

    <!-- Early connection hints for the data origins (CSV + product images) -->
    <link
      rel="preconnect"
      href="https://doc-0o-ac-sheets.googleusercontent.com"
      crossorigin
    />
    <link rel="preconnect" href="https://drive.google.com" />
    <link rel="dns-prefetch" href="https://docs.google.com" />
    <link rel="dns-prefetch" href="https://drive.google.com" />
    <link rel="dns-prefetch" href="https://googleusercontent.com" />
    <!-- HTTPS proxy used only when catalog links are plain http:// -->
    <link rel="dns-prefetch" href="https://images.weserv.nl" />

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/ship-check.css" />
  </head>
  <body>
    <!-- Floating Toast Notification -->
    <div id="toast-banner" class="toast-banner"></div>

    <div>
      <span id="info-modal">
        For Canva link, consider "PRESS AND HOLD" the icon
      </span>
    </div>

    <div class="container">
      <div class="header-controls">
        <button class="btn" onclick="openModal('cat-modal')">
          Categories 🍃
        </button>
        <button class="btn" onclick="openModal('opt-modal')">Tabs ⚙️</button>
        <button
          class="btn"
          id="ship-check-trigger"
          onclick="openModal('ship-modal')"
        >
          Cek Ongkir 🚚
        </button>
        <button
          class="btn"
          id="theme-toggle"
          onclick="toggleTheme()"
          title="Toggle theme"
          aria-label="Toggle theme"
        >
          🌙
        </button>
      </div>

      <div class="search-box">
        <input
          type="text"
          id="search-input"
          placeholder="Search SKU or others... 🔍"
          autocomplete="off"
        />
      </div>

      <div id="loading">Loading data... 🌬️</div>
      <div id="data-list"></div>
      <button id="load-more" class="load-more" style="display: none">
        Load more…
      </button>
    </div>

    <!-- Category Modal -->
    <div id="cat-modal" class="modal" onclick="closeModal(event, 'cat-modal')">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Select Category ✅</h3>
          <button class="close-btn" onclick="closeModal(null, 'cat-modal')">
            &times;
          </button>
        </div>
        <input
          type="text"
          class="cat-search"
          placeholder="Filter categories... 🔍"
          autocomplete="off"
        />
        <div id="cat-grid"></div>
      </div>
    </div>

    <!-- Options Modal -->
    <div id="opt-modal" class="modal" onclick="closeModal(event, 'opt-modal')">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Select Active Tab ⚙️</h3>
          <button class="close-btn" onclick="closeModal(null, 'opt-modal')">
            &times;
          </button>
        </div>
        <div class="radio-group" id="opt-group"></div>
      </div>
    </div>

    <!-- Image Modal -->
    <div id="img-modal" class="modal" onclick="closeModal(event, 'img-modal')">
      <div
        class="modal-content"
        id="img-modal-content"
        onclick="event.stopPropagation()"
      >
        <div id="img-loading">Loading image…</div>
        <img
          id="modal-image"
          src=""
          alt="Link Preview"
          decoding="async"
          style="display: none"
        />
      </div>
    </div>

    <!-- Shipment Price Check Modal (Biteship) -->
    <div
      id="ship-modal"
      class="modal"
      onclick="closeModal(event, 'ship-modal')"
    >
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Shipment Price Check 🚚</h3>
          <button class="close-btn" onclick="closeModal(null, 'ship-modal')">
            &times;
          </button>
        </div>
        <form id="ship-check-form" class="ship-check-form">
          <!-- 1. Destination Postal Code (Default) -->
          <label for="ship-dest">Destination Postal Code</label>
          <input
            type="text"
            id="ship-dest"
            inputmode="numeric"
            autocomplete="postal-code"
            placeholder="e.g. 12440"
            required
          />

          <!-- 2. Weight (Gr) (Default) -->
          <label for="ship-weight">Weight (grams)</label>
          <input
            type="number"
            id="ship-weight"
            min="1"
            step="1"
            value="1000"
            required
          />

          <!-- 3. Shop Postal Code -->
          <div class="form-group">
            <label for="ship-origin">Shop Postal Code / Location</label>

            <!-- Container for selected shop location chip -->
            <div id="shop-location-chip-container" class="chips-wrapper"></div>

            <!-- Search wrapper with dynamic dropdown -->
            <div class="shop-location-wrapper" style="position: relative">
              <input
                type="text"
                id="ship-origin"
                placeholder="e.g. Margo, Bandung, or 40287..."
                autocomplete="off"
              />
              <div
                id="shop-location-dropdown"
                class="search-dropdown"
                style="display: none"
              ></div>
            </div>
          </div>

          <!-- 4. Couriers (Section 2) -->
          <div class="form-group">
            <label id="ship-check-couriers-label">Couriers</label>

            <!-- Container for selected courier chips -->
            <div id="courier-chips-container" class="chips-wrapper"></div>

            <!-- Search input & dynamic dropdown -->
            <div class="courier-search-wrapper" style="position: relative">
              <input
                type="text"
                id="courier-search-input"
                placeholder="Search courier (e.g. JNE, SiCepat)..."
                autocomplete="off"
              />
              <div
                id="courier-dropdown-results"
                class="search-dropdown"
                style="display: none"
              ></div>
            </div>
          </div>
          <button type="submit" class="ship-check-submit">Check Price</button>
        </form>
        <div id="ship-check-status" class="ship-check-status"></div>
        <div id="ship-check-results" class="ship-check-results"></div>
      </div>
    </div>

    <!-- All scripts deferred: none render-blocking; execution order is
         preserved (CONFIG → fx → typewriter → app → ship-check-app).
         fx.js only injects CSS from CONFIG.fx — it never touches the
         typewriter or app. ship-check-app.js runs after app.js so it can
         reuse app.js's global openModal()/closeModal(). -->
    <script src="js/CONFIG.js" defer></script>
    <script src="js/fx.js" defer></script>
    <script src="js/typewriter-effect.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/ship-check-app.js" defer></script>
  </body>
</html>
