<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Catalog Explorer — search SKU, prices, and product details from the catalog."
    />
    <title>Catalog Explorer 🍃</title>

    <!-- Inline SVG favicon: zero extra requests, no favicon.ico 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🍃</text></svg>"
    />

    <!-- Early connection hints for the data origins (CSV + product images) -->
    <link rel="preconnect" href="https://doc-0o-ac-sheets.googleusercontent.com" crossorigin />
    <link rel="preconnect" href="https://drive.google.com" />
    <link rel="dns-prefetch" href="https://docs.google.com" />
    <link rel="dns-prefetch" href="https://drive.google.com" />
    <link rel="dns-prefetch" href="https://googleusercontent.com" />
    <!-- HTTPS proxy used only when catalog links are plain http:// -->
    <link rel="dns-prefetch" href="https://images.weserv.nl" />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header-controls">
        <button class="btn" onclick="openModal('cat-modal')">
          Categories 🍃
        </button>
        <button class="btn" onclick="openModal('opt-modal')">Tabs ⚙️</button>
        <button class="btn" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
          🌙
        </button>
      </div>

      <div class="search-box">
        <input
          type="text"
          id="search-input"
          placeholder="Search SKU or others... 🔍"
          autocomplete="off"
        />
      </div>

      <div id="loading">Loading data... 🌬️</div>
      <div id="data-list"></div>
      <button id="load-more" class="load-more" style="display: none">
        Load more…
      </button>
    </div>

    <!-- Category Modal -->
    <div id="cat-modal" class="modal" onclick="closeModal(event, 'cat-modal')">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Select Category ✅</h3>
          <button class="close-btn" onclick="closeModal(null, 'cat-modal')">
            &times;
          </button>
        </div>
        <input
          type="text"
          class="cat-search"
          placeholder="Filter categories... 🔍"
          autocomplete="off"
        />
        <div id="cat-grid"></div>
      </div>
    </div>

    <!-- Options Modal -->
    <div id="opt-modal" class="modal" onclick="closeModal(event, 'opt-modal')">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Select Active Tab ⚙️</h3>
          <button class="close-btn" onclick="closeModal(null, 'opt-modal')">
            &times;
          </button>
        </div>
        <div class="radio-group" id="opt-group"></div>
      </div>
    </div>

    <!-- Image Modal -->
    <div id="img-modal" class="modal" onclick="closeModal(event, 'img-modal')">
      <div
        class="modal-content"
        id="img-modal-content"
        onclick="event.stopPropagation()"
      >
        <div id="img-loading">Loading image…</div>
        <img
          id="modal-image"
          src=""
          alt="Link Preview"
          decoding="async"
          style="display: none"
        />
      </div>
    </div>

    <!-- All scripts deferred: none render-blocking; execution order is
         preserved (CONFIG → fx → typewriter → app). fx.js only injects
         CSS from CONFIG.fx — it never touches the typewriter or app. -->
    <script src="js/CONFIG.js" defer></script>
    <script src="js/fx.js" defer></script>
    <script src="js/typewriter-effect.js" defer></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
