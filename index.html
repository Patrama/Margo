<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog Explorer 🍃</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header-controls">
        <button class="btn" onclick="openModal('cat-modal')">
          Categories 🍃
        </button>
        <button class="btn" onclick="openModal('opt-modal')">Tabs ⚙️</button>
      </div>

      <div class="search-box">
        <input
          type="text"
          id="search-input"
          placeholder="Search SKU or others... 🔍"
          autocomplete="off"
        />
      </div>

      <div id="loading">Loading data... 🌬️</div>
      <div id="data-list"></div>
      <button id="load-more" class="load-more" style="display: none">
        Load more…
      </button>
    </div>

    <!-- Category Modal -->
    <div id="cat-modal" class="modal" onclick="closeModal(event, 'cat-modal')">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Select Category ✅</h3>
          <button class="close-btn" onclick="closeModal(null, 'cat-modal')">
            &times;
          </button>
        </div>
        <input
          type="text"
          class="cat-search"
          placeholder="Filter categories... 🔍"
          autocomplete="off"
        />
        <div id="cat-grid"></div>
      </div>
    </div>

    <!-- Options Modal -->
    <div id="opt-modal" class="modal" onclick="closeModal(event, 'opt-modal')">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Select Active Tab ⚙️</h3>
          <button class="close-btn" onclick="closeModal(null, 'opt-modal')">
            &times;
          </button>
        </div>
        <div class="radio-group" id="opt-group"></div>
      </div>
    </div>

    <!-- Image Modal -->
    <div id="img-modal" class="modal" onclick="closeModal(event, 'img-modal')">
      <div
        class="modal-content"
        id="img-modal-content"
        onclick="event.stopPropagation()"
      >
        <div id="img-loading">Loading image…</div>
        <img
          id="modal-image"
          src=""
          alt="Link Preview"
          decoding="async"
          style="display: none"
        />
      </div>
    </div>

    <script src="js/CONFIG.js"></script>
    <script src="js/typewriter-effect.js"></script>
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
